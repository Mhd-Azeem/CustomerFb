name: Import existing website media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CustomerFb
        uses: actions/checkout@v4
      - name: Download media from existing live Pages site
        run: |
          set -eu
          BASE="https://gulf-job-vacancies.pages.dev"
          curl --fail --location --retry 3 --max-time 90 "$BASE/logo.webp" -o logo.webp
          curl --fail --location --retry 3 --max-time 90 "$BASE/poster.jpg" -o poster.jpg
          curl --fail --location --retry 3 --max-time 180 "$BASE/oman-video.mp4" -o oman-video.mp4
          test "$(wc -c < logo.webp)" -gt 1000
          test "$(wc -c < poster.jpg)" -gt 1000
          test "$(wc -c < oman-video.mp4)" -gt 100000
          file logo.webp poster.jpg oman-video.mp4
          file --mime-type logo.webp | grep -q 'image/webp'
          file --mime-type poster.jpg | grep -q 'image/jpeg'
          file --mime-type oman-video.mp4 | grep -q 'video/mp4'
      - name: Commit media to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.webp poster.jpg oman-video.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Import existing live website images and video"
            git push
          fi
