name: Deploy website to existing Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "logo.webp"
      - "poster.jpg"
      - "oman-video.mp4"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gulf-job-vacancies-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Verify required website assets
        run: |
          set -eu
          for file in index.html logo.webp poster.jpg oman-video.mp4; do
            test -s "$file" || { echo "::error::$file is missing. Run 'Import existing website media' first."; exit 1; }
          done
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions repository secret."; exit 1; }
      - name: Deploy to gulf-job-vacancies Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . --project-name=gulf-job-vacancies --branch=main
